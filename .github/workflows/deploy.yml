name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Mengatur izin token GitHub untuk mempublikasikan halaman ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Memastikan hanya satu proses deployment yang berjalan bersamaan
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Pekerjaan untuk membangun website statis (Build)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pasang Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Pasang dependensi
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Bangun website (Vite build)
        run: npm run build

      - name: Unggah artifak Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # Pekerjaan untuk menerbitkan ke GitHub Pages (Deploy)
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Terbitkan ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
